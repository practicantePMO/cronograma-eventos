<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Cronograma PMO</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/fullcalendar/6.1.15/index.global.min.css" rel="stylesheet" />
<style>
  :root {
    --azul: #185fa5;
    --gris-fondo: #f6f5f2;
    --gris-borde: #d8d6cd;
    --texto: #2c2c2a;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    background: var(--gris-fondo);
    color: var(--texto);
  }
  header {
    background: white;
    border-bottom: 1px solid var(--gris-borde);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  .filtros {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  select, button {
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--gris-borde);
    background: white;
    font-size: 14px;
    cursor: pointer;
  }
  main { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
  #calendario {
    background: white;
    border-radius: 12px;
    border: 1px solid var(--gris-borde);
    padding: 16px;
  }
  .fc-event { cursor: pointer; border: none !important; }
  .leyenda { display: flex; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; font-size: 13px; }
  .leyenda span { display: flex; align-items: center; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  #modal {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.45);
    align-items: center; justify-content: center;
    padding: 16px;
  }
  #modal .caja {
    background: white; border-radius: 12px; padding: 24px;
    max-width: 420px; width: 100%;
  }
  #modal h2 { margin-top: 0; font-size: 17px; }
  #modal p { font-size: 14px; line-height: 1.6; color: #555; }
  #modal a { color: var(--azul); }
  #modal button.cerrar {
    margin-top: 12px; background: var(--azul); color: white; border: none;
  }
</style>
</head>
<body>

<header>
  <h1>Cronograma de proyectos PMO</h1>
  <div class="filtros">
    <select id="filtroProyecto"><option value="">Todos los proyectos</option></select>
    <select id="filtroCategoria"><option value="">Todas las categorias</option></select>
    <a href="/admin.html" style="padding:8px 12px;background:var(--azul);color:white;border-radius:8px;text-decoration:none;font-size:14px;">+ Agregar proyecto</a>
  </div>
</header>

<main>
  <div class="leyenda">
    <span><span class="dot" style="background:#185fa5"></span> Automatico (fuente verificada)</span>
    <span><span class="dot" style="background:#993c1d"></span> Manual (agregado por el equipo)</span>
  </div>
  <div id="calendario"></div>
</main>

<div id="modal">
  <div class="caja">
    <h2 id="modalTitulo"></h2>
    <p id="modalDescripcion"></p>
    <p id="modalMeta"></p>
    <button class="cerrar" onclick="cerrarModal()">Cerrar</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/fullcalendar/6.1.15/index.global.min.js"></script>
<script>
  // ==== CONFIGURA ESTO con tus datos de Supabase ====
  const SUPABASE_URL = "https://TU_PROYECTO.supabase.co";
  const SUPABASE_ANON_KEY = "TU_LLAVE_ANON_PUBLICA";
  // ===================================================

  let eventosCache = [];

  async function cargarDatos() {
    const [eventosRes, proyectosRes] = await Promise.all([
      fetch(`${SUPABASE_URL}/rest/v1/eventos?select=*`, {
        headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` }
      }),
      fetch(`${SUPABASE_URL}/rest/v1/proyectos?select=*`, {
        headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` }
      })
    ]);
    const eventos = await eventosRes.json();
    const proyectos = await proyectosRes.json();
    return { eventos, proyectos };
  }

  function llenarFiltro(select, valores) {
    valores.forEach(v => {
      const opt = document.createElement("option");
      opt.value = v; opt.textContent = v;
      select.appendChild(opt);
    });
  }

  function abrirModal(evento) {
    document.getElementById("modalTitulo").textContent = evento.title;
    document.getElementById("modalDescripcion").textContent = evento.extendedProps.descripcion || "Sin descripcion.";
    const meta = [];
    if (evento.extendedProps.categoria) meta.push(`Categoria: ${evento.extendedProps.categoria}`);
    if (evento.extendedProps.fuente_nombre) meta.push(`Fuente: ${evento.extendedProps.fuente_nombre}`);
    if (evento.extendedProps.url) meta.push(`<a href="${evento.extendedProps.url}" target="_blank" rel="noopener">Ver enlace original</a>`);
    document.getElementById("modalMeta").innerHTML = meta.join(" · ");
    document.getElementById("modal").style.display = "flex";
  }
  function cerrarModal() { document.getElementById("modal").style.display = "none"; }

  (async function init() {
    const { eventos, proyectos } = await cargarDatos();
    eventosCache = eventos;

    const proyectosPorId = Object.fromEntries(proyectos.map(p => [p.id, p]));
    const nombresProyectos = proyectos.map(p => p.nombre);
    const categorias = [...new Set(eventos.map(e => e.categoria).filter(Boolean))];

    llenarFiltro(document.getElementById("filtroProyecto"), nombresProyectos);
    llenarFiltro(document.getElementById("filtroCategoria"), categorias);

    const calendarEl = document.getElementById("calendario");
    const calendar = new FullCalendar.Calendar(calendarEl, {
      initialView: "dayGridMonth",
      locale: "es",
      height: "auto",
      headerToolbar: { left: "prev,next today", center: "title", right: "dayGridMonth,listMonth" },
      events: mapearEventos(eventos, proyectosPorId),
      eventClick: (info) => abrirModal(info.event)
    });
    calendar.render();

    function refrescar() {
      const fp = document.getElementById("filtroProyecto").value;
      const fc = document.getElementById("filtroCategoria").value;
      const filtrados = eventosCache.filter(e => {
        const nombreProyecto = proyectosPorId[e.proyecto_id]?.nombre;
        const okProyecto = !fp || nombreProyecto === fp;
        const okCategoria = !fc || e.categoria === fc;
        return okProyecto && okCategoria;
      });
      calendar.removeAllEvents();
      calendar.addEventSource(mapearEventos(filtrados, proyectosPorId));
    }
    document.getElementById("filtroProyecto").addEventListener("change", refrescar);
    document.getElementById("filtroCategoria").addEventListener("change", refrescar);
  })();

  function mapearEventos(eventos, proyectosPorId) {
    return eventos.map(e => ({
      id: e.id,
      title: e.titulo,
      start: e.fecha_inicio,
      end: e.fecha_fin || undefined,
      color: e.fuente_tipo === "manual" ? "#993c1d" : "#185fa5",
      extendedProps: {
        descripcion: e.descripcion,
        categoria: e.categoria,
        fuente_nombre: e.fuente_nombre,
        url: e.url,
        proyecto: proyectosPorId[e.proyecto_id]?.nombre
      }
    }));
  }
</script>
</body>
</html>
